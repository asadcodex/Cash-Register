<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Register</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header>
        <div class="logo">Asad Raza (🔥)</div>
        <h1>Cash Register Project</h1>
    </header>

    <div class="register-container">
        <div class="input-section">
            <label for="cash">Enter cash from customer:</label>
            <input type="number" id="cash" step="0.01">
            <button id="purchase-btn">Purchase</button>
        </div>

        <div class="register-display">
            <div class="total-display">
                Total: $3.26
            </div>
            <div class="register-body">
                <div class="drawer-content">
                    <h3>Change in drawer:</h3>
                    <div>Pennies: $0.93</div>
                    <div>Nickels: $2.05</div>
                    <div>Dimes: $2.70</div>
                    <div>Quarters: $3.25</div>
                    <div>Ones: $86.00</div>
                    <div>Fives: $50.00</div>
                    <div>Tens: $0.00</div>
                    <div>Twenties: $0.00</div>
                    <div>Hundreds: $100.00</div>
                </div>
                <div class="drawer-slot"></div>
            </div>
        </div>

        <div id="change-due"></div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
